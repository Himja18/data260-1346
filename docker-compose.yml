# HW8 (s1346) - Kafka + incident worker + FastAPI wrapper.
#   docker compose up -d --build        then  make hw08-topics
# Kafka is reachable from the Mac at localhost:9092 (agents, demo, verify) and from the
# containers at kafka:29092. Topic auto-creation is OFF, so every topic is created with the CLI.
name: s1346-hw08

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: s1346-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  incident-worker:
    build:
      context: .
      dockerfile: code/kafka_service/Dockerfile
    container_name: s1346-incident-worker
    command: ["python", "worker.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      STUDENT_NAME: ${STUDENT_NAME:-Himja Patel}
      TZ: PST8PDT,M3.2.0,M11.1.0               # same clock/zone as the Mac, so log lines line up
    volumes:
      - ./reports/hw08:/app/reports/hw08        # worker log lines + trace land in the repo's report folder
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  incident-api:
    build:
      context: .
      dockerfile: code/kafka_service/Dockerfile
    container_name: s1346-incident-api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8446"]
    ports:
      - "8446:8446"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      STUDENT_NAME: ${STUDENT_NAME:-Himja Patel}
      TZ: PST8PDT,M3.2.0,M11.1.0
    volumes:
      - ./reports/hw08:/app/reports/hw08
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  # HW9 - Redis Stack (Redis + RediSearch vector index). All keys start with s1346:
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: s1346-redis
    ports:
      - "6379:6379"
    volumes:
      - s1346-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

volumes:
  s1346-redis-data:
