<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}s1346 Transit Incident Portal{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body { background-color: #f5f6f8; }
    .navbar-brand { font-weight: 700; letter-spacing: 0.02em; }
    .card { border: none; box-shadow: 0 8px 24px rgba(22,33,62,0.10); }
    .route-strip { height: 5px; display: flex; margin-bottom: 0; }
    .route-strip span { flex: 1; }
    .route-strip span:nth-child(1) { background:#F2A93C; }
    .route-strip span:nth-child(2) { background:#458647; }
    .route-strip span:nth-child(3) { background:#8C443B; }
    .route-strip span:nth-child(4) { background:#2E6E9E; }
  </style>
</head>
<body>
  <div class="route-strip" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Route 2 &middot; Transit Incident Portal</a>
      <div class="d-flex">
        {% if logged_in %}
          <a class="btn btn-outline-light btn-sm me-2" href="/dashboard">Dashboard</a>
          <a class="btn btn-warning btn-sm" href="/logout">Log out</a>
        {% else %}
          <a class="btn btn-warning btn-sm" href="/login">Log in</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container py-5">
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center text-muted small py-4">
    DATA-260 &middot; DOMAIN_ID 2 &middot; Municipal Transit Incidents &middot; s1346
  </footer>
</body>
</html>
