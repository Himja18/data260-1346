<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HW1-Himja Patel</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f7f7fb;
      color: #222;
    }
    h1 {
      font-size: 2.2rem;
      color: #1a3c6e;
    }
    form {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 16px;
    }
    .checkbox-row input {
      margin-right: 8px;
      width: auto;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #1a3c6e;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #14305a;
    }
  </style>
</head>
<body>

  <h1>Municipal Transit Incident Report</h1>

  <form id="incidentForm">
    <label for="routeId">Route / Incident Title (required)</label>
    <input
      type="text"
      id="routeId"
      name="routeId"
      placeholder="e.g., Line 22 - Bus stalled on Main St"
      required
      autofocus
    />

    <label for="location">Location (required)</label>
    <input
      type="text"
      id="location"
      name="location"
      placeholder="e.g., Main St & 5th Ave stop"
      required
    />

    <label for="reporterEmail">Your Email (required)</label>
    <input
      type="email"
      id="reporterEmail"
      name="reporterEmail"
      placeholder="e.g., jane.doe@email.com"
      required
    />

    <label for="description">Incident Description (required)</label>
    <textarea
      id="description"
      name="description"
      placeholder="Describe what happened, when, and any other relevant details (min. 25 characters)"
      required
    ></textarea>

    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="Delay">Delay</option>
      <option value="Breakdown">Breakdown</option>
      <option value="Accident">Accident</option>
      <option value="Service Change">Service Change</option>
    </select>

    <div class="checkbox-row">
      <input type="checkbox" id="agreeToTerms" name="agreeToTerms" />
      <label for="agreeToTerms" style="margin:0; font-weight:normal;">
        I agree to the terms and conditions.
      </label>
    </div>

    <button type="submit">Report Incident</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
