<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HW1-Himja Patel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16213E;
      --amber: #F2A93C;
      --paper: #F7F5EF;
      --steel: #5B6472;
      --line: #D8D3C4;
      --card: #FFFFFF;
      --delay: #F2A93C;
      --breakdown: #5B6472;
      --accident: #C4483C;
      --service-change: #2E6E9E;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      margin: 0;
      padding: 48px 20px 80px;
      background: var(--paper);
      background-image:
        radial-gradient(circle at 100% 0%, rgba(242,169,60,0.08) 0%, transparent 45%),
        radial-gradient(circle at 0% 100%, rgba(22,33,62,0.05) 0%, transparent 45%);
      color: var(--ink);
      min-height: 100vh;
    }

    .page {
      max-width: 620px;
      margin: 0 auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .line-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(242,169,60,0.25);
      flex-shrink: 0;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--steel);
    }

    h1 {
      font-family: 'Archivo', Arial, sans-serif;
      font-weight: 800;
      font-size: 2.15rem;
      letter-spacing: -0.01em;
      margin: 6px 0 28px;
      color: var(--ink);
    }

    .route-strip {
      display: flex;
      height: 6px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0;
    }
    .route-strip span { flex: 1; }
    .route-strip span:nth-child(1) { background: var(--delay); }
    .route-strip span:nth-child(2) { background: var(--breakdown); }
    .route-strip span:nth-child(3) { background: var(--accident); }
    .route-strip span:nth-child(4) { background: var(--service-change); }

    form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 36px 34px 32px;
      box-shadow: 0 18px 40px -20px rgba(22,33,62,0.25);
    }

    label {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 22px;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--ink);
    }
    label:first-of-type { margin-top: 0; }

    label .req {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 500;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--amber);
      background: rgba(242,169,60,0.14);
      padding: 2px 6px;
      border-radius: 3px;
    }

    input[type="text"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: 4px;
      font-size: 0.98rem;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      color: var(--ink);
      background: #FDFCFA;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #routeId {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(242,169,60,0.22);
    }

    textarea {
      resize: vertical;
      min-height: 96px;
      line-height: 1.5;
    }

    select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'%3E%3Cpath d='M1 1L7 7L13 1' stroke='%235B6472' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
      cursor: pointer;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding: 12px 14px;
      background: rgba(22,33,62,0.035);
      border-radius: 4px;
    }
    .checkbox-row input {
      width: 17px;
      height: 17px;
      accent-color: var(--ink);
      cursor: pointer;
    }
    .checkbox-row label {
      margin: 0;
      font-weight: 500;
      font-size: 0.88rem;
      color: var(--steel);
      cursor: pointer;
    }

    button {
      margin-top: 26px;
      width: 100%;
      padding: 14px 20px;
      background: var(--ink);
      color: #FFF;
      border: none;
      border-radius: 4px;
      font-family: 'Archivo', Arial, sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button:hover { background: #0F1730; }
    button:active { transform: scale(0.99); }

    .footnote {
      margin-top: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--steel);
      text-align: center;
      letter-spacing: 0.03em;
    }

    /* ===== Entity List (HW2 Part 1) ===== */

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 40px 0 14px;
    }
    .section-heading h2 {
      font-family: 'Archivo', Arial, sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      margin: 0;
      color: var(--ink);
    }
    .section-heading .count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      color: var(--steel);
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-row input[type="search"] {
      flex: 1;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: 4px;
      font-size: 0.95rem;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      background: #FDFCFA;
      color: var(--ink);
    }
    .search-row input[type="search"]:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(242,169,60,0.22);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .btn-secondary {
      flex: 1;
      min-width: 160px;
      padding: 10px 14px;
      background: var(--card);
      color: var(--ink);
      border: 1.5px solid var(--line);
      border-radius: 4px;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .btn-secondary:hover { border-color: var(--steel); background: #FBFAF6; }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    .list-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: 0 18px 40px -20px rgba(22,33,62,0.25);
      overflow: hidden;
    }

    /* State panels: loading / empty / error — one shown at a time */
    .state-panel {
      display: none;
      padding: 40px 24px;
      text-align: center;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-size: 0.92rem;
      color: var(--steel);
    }
    .state-panel.is-visible { display: block; }

    .state-panel.loading .spinner {
      width: 22px;
      height: 22px;
      margin: 0 auto 12px;
      border: 3px solid var(--line);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .state-panel.error {
      color: var(--accident);
    }
    .state-panel.error button {
      margin-top: 14px;
      width: auto;
      padding: 8px 18px;
      font-size: 0.82rem;
    }

    .incident-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .incident-table th {
      text-align: left;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--steel);
      padding: 12px 16px;
      border-bottom: 1.5px solid var(--line);
      background: rgba(22,33,62,0.025);
    }
    .incident-table td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      vertical-align: top;
    }
    .incident-table tr:last-child td { border-bottom: none; }
    .incident-table .id-cell {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--steel);
      font-size: 0.82rem;
    }
    .tag-pill {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      color: #FFF;
    }
    .tag-pill.delay { background: var(--delay); color: var(--ink); }
    .tag-pill.breakdown { background: var(--breakdown); }
    .tag-pill.accident { background: var(--accident); }
    .tag-pill.service-change { background: var(--service-change); }

    .inline-status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      margin-top: -4px;
      margin-bottom: 14px;
      min-height: 1em;
    }
    .inline-status.ok { color: #2E6E30; }
    .inline-status.fail { color: var(--accident); }

    /* ===== 375px usability (Part 1 requirement) ===== */
    @media (max-width: 375px) {
      body { padding: 24px 12px 56px; }
      h1 { font-size: 1.6rem; }
      form { padding: 24px 18px 22px; }
      .search-row { flex-direction: column; }
      .toolbar { flex-direction: column; }
      .btn-secondary { min-width: 0; }

      /* Table becomes a stacked card list on narrow screens */
      .incident-table thead { display: none; }
      .incident-table, .incident-table tbody, .incident-table tr, .incident-table td {
        display: block;
        width: 100%;
      }
      .incident-table tr {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .incident-table td {
        border-bottom: none;
        padding: 4px 0;
      }
      .incident-table td::before {
        content: attr(data-label);
        display: block;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--steel);
        margin-bottom: 2px;
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="masthead">
      <span class="line-dot"></span>
      <span class="eyebrow">Route 2 &middot; Rider Report Line</span>
    </div>
    <h1>Municipal Transit Incident Report</h1>

    <div class="route-strip" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="section-heading">
      <h2>Reported Incidents</h2>
      <span class="count" id="resultCount"></span>
    </div>

    <div class="search-row">
      <input
        type="search"
        id="searchInput"
        placeholder="Search by title or category&hellip;"
        aria-label="Search incidents by title or category"
      />
    </div>

    <div class="toolbar">
      <button type="button" class="btn-secondary" id="updateFirstBtn">Update Record #1</button>
      <button type="button" class="btn-secondary" id="deleteHighestBtn">Delete Highest ID</button>
    </div>
    <div class="inline-status" id="actionStatus"></div>

    <div class="list-card">
      <div class="state-panel loading" id="stateLoading">
        <div class="spinner" aria-hidden="true"></div>
        Loading incidents&hellip;
      </div>
      <div class="state-panel" id="stateEmpty">
        No incidents match your search.
      </div>
      <div class="state-panel error" id="stateError">
        Couldn&rsquo;t load incidents. The backend may be offline.
        <div><button type="button" id="retryBtn">Retry</button></div>
      </div>
      <table class="incident-table" id="incidentTable" style="display:none;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Route / Title</th>
            <th>Location</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="incidentTableBody"></tbody>
      </table>
    </div>

    <div class="section-heading">
      <h2>Report New Incident</h2>
    </div>

    <form id="incidentForm">
      <label for="routeId">Route / Incident Title <span class="req">Required</span></label>
      <input
        type="text"
        id="routeId"
        name="routeId"
        placeholder="e.g., Line 22 - Bus stalled on Main St"
        required
        autofocus
      />

      <label for="location">Location <span class="req">Required</span></label>
      <input
        type="text"
        id="location"
        name="location"
        placeholder="e.g., Main St & 5th Ave stop"
        required
      />

      <label for="reporterEmail">Your Email <span class="req">Required</span></label>
      <input
        type="email"
        id="reporterEmail"
        name="reporterEmail"
        placeholder="e.g., jane.doe@email.com"
        required
      />

      <label for="description">Incident Description <span class="req">Required</span></label>
      <textarea
        id="description"
        name="description"
        placeholder="Describe what happened, when, and any other relevant details (min. 25 characters)"
        required
      ></textarea>

      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="Delay">Delay</option>
        <option value="Breakdown">Breakdown</option>
        <option value="Accident">Accident</option>
        <option value="Service Change">Service Change</option>
      </select>

      <div class="checkbox-row">
        <input type="checkbox" id="agreeToTerms" name="agreeToTerms" />
        <label for="agreeToTerms">I agree to the terms and conditions.</label>
      </div>

      <button type="submit">Report Incident</button>
    </form>

    <div class="footnote">DATA-260 &middot; DOMAIN_ID 2 &middot; Municipal Transit Incidents</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
