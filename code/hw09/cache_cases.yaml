# HW9 Part 3.1 - labelled cache cases (s1346 | Himja Patel | Municipal Transit Incidents)
#
# Written and committed BEFORE any threshold sweep. Labels are never edited after seeing results;
# a labelling mistake found later is documented in reports/hw09/LABEL_NOTES.md instead.
#
# seeds  = the 12 questions placed in the cache first (answers come from the HW8 agent pipeline,
#          incident facts from s1346_rel). Every case is compared against this cache.
# cases  = 40 incoming questions:
#          10 exact_duplicate     - same text as a seed            -> should hit that seed
#          10 paraphrase          - same meaning, different words  -> should hit that seed
#          10 superficially_similar - looks like a seed but the correct answer differs -> should miss
#          10 unrelated           - not about the cached questions -> should miss
# A hit counts as a FALSE HIT when should_hit is false, or when it returns a different seed than `seed`.
version: 1
domain: Municipal Transit Incidents (DOMAIN_ID 2)
seeds:
